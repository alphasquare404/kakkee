query ReaderChapter($chapterId: Int!) {
  chapter(id: $chapterId) {
    id
    name
    pageCount
    chapterNumber
    sourceOrder
    isRead
    isDownloaded
    isBookmarked
    lastPageRead
    manga {
      id
      title
      thumbnailUrl
      inLibrary
      source {
        id
        contentWarning
      }
    }
  }
}
