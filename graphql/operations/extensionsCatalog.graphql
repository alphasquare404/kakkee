query ExtensionsCatalog($first: Int!, $after: Cursor) {
  extensions(first: $first, after: $after, order: [{ by: NAME, byType: ASC }]) {
    totalCount
    nodes {
      pkgName
      name
      versionName
      lang
      isInstalled
      hasUpdate
      isObsolete
      iconUrl
      contentWarning
      extensionStore {
        name
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
