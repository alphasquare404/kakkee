query LibraryMangas(
  $first: Int!
  $after: Cursor
  $filter: MangaFilterInput
  $order: [MangaOrderInput!]
) {
  mangas(
    condition: { inLibrary: true }
    first: $first
    after: $after
    filter: $filter
    order: $order
  ) {
    nodes {
      id
      title
      thumbnailUrl
      thumbnailUrlLastFetched
      unreadCount
      downloadCount
      lastReadChapter {
        id
        name
        chapterNumber
        lastPageRead
        pageCount
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
    totalCount
  }
}
