query SourceInfo($id: LongString!) {
  source(id: $id) {
    id
    displayName
    name
    lang
    contentWarning
    filters {
      __typename
      ... on TextFilter {
        name
        textDefault: default
      }
      ... on SelectFilter {
        name
        selectDefault: default
        values
      }
      ... on CheckBoxFilter {
        name
        checkDefault: default
      }
      ... on TriStateFilter {
        name
        triDefault: default
      }
      ... on SortFilter {
        name
        sortDefault: default {
          index
          ascending
        }
        values
      }
      ... on HeaderFilter {
        name
      }
      ... on SeparatorFilter {
        name
      }
      ... on GroupFilter {
        name
        filters {
          __typename
          ... on TextFilter {
            name
            textDefault: default
          }
          ... on SelectFilter {
            name
            selectDefault: default
            values
          }
          ... on CheckBoxFilter {
            name
            checkDefault: default
          }
          ... on TriStateFilter {
            name
            triDefault: default
          }
          ... on SortFilter {
            name
            sortDefault: default {
              index
              ascending
            }
            values
          }
          ... on HeaderFilter {
            name
          }
          ... on SeparatorFilter {
            name
          }
        }
      }
    }
  }
}
