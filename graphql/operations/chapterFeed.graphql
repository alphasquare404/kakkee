query ChapterFeed(
  $first: Int!
  $after: Cursor
  $filter: ChapterFilterInput
  $order: [ChapterOrderInput!]!
) {
  chapters(first: $first, after: $after, filter: $filter, order: $order) {
    nodes {
      id
      name
      chapterNumber
      pageCount
      isRead
      isDownloaded
      lastPageRead
      lastReadAt
      uploadDate
      scanlator
      manga {
        id
        title
        thumbnailUrl
        source {
          id
          contentWarning
        }
        categories {
          nodes {
            id
          }
        }
      }
    }
    totalCount
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
