query GlobalNsfwDefault {
  metas(
    filter: {
      key: {
        in: [
          "kakkee.nsfw-default"
          "kakkee.hidden-category-ids"
        ]
      }
    }
  ) {
    nodes {
      key
      value
    }
  }
}

mutation SetGlobalNsfwDefault($input: SetGlobalMetaInput!) {
  setGlobalMeta(input: $input) {
    meta {
      key
      value
    }
  }
}
