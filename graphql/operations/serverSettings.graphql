query ServerSettings {
  settings {
    authMode
    databaseType
    updateMangas
    autoDownloadNewChapters
    autoDownloadNewChaptersLimit
    downloadAsCbz
    downloadsPath
    maxSourcesInParallel
    globalUpdateInterval
    excludeCompleted
    excludeNotStarted
    excludeUnreadChapters
    excludeEntryWithUnreadChapters
    debugLogsEnabled
    backupPath
    backupInterval
    webUIChannel
    webUIFlavor
    webUIInterface
  }
}
