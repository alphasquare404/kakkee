query ServerSettings {
  settings {
    authMode
    authUsername
    authPassword
    databaseType
    databaseUrl
    databaseUsername
    databasePassword
    updateMangas
    autoDownloadNewChapters
    autoDownloadNewChaptersLimit
    downloadAsCbz
    downloadsPath
    maxSourcesInParallel
    globalUpdateInterval
    excludeCompleted
    excludeNotStarted
    excludeUnreadChapters
    excludeEntryWithUnreadChapters
    debugLogsEnabled
    backupPath
    backupInterval
    webUIChannel
    webUIFlavor
    webUIInterface
    opdsCbzMimetype
    opdsChapterSortOrder
    opdsEnablePageReadProgress
    opdsItemsPerPage
    opdsMarkAsReadOnDownload
    opdsShowOnlyDownloadedChapters
    opdsShowOnlyUnreadChapters
    opdsSkipChapterMetadataFeed
    opdsUseBinaryFileSizes
    koreaderSyncChecksumMethod
    koreaderSyncPercentageTolerance
    koreaderSyncStrategyBackward
    koreaderSyncStrategyForward
    downloadConversions {
      mimeType
      target
      compressionLevel
    }
    serveConversions {
      mimeType
      target
      compressionLevel
    }
  }
}
