query GlobalSearch($search: String!) {
  mangas(
    filter: { title: { includesInsensitive: $search } }
    order: [{ by: TITLE, byType: ASC }]
    first: 60
  ) {
    totalCount
    nodes {
      id
      title
      thumbnailUrl
      inLibrary
      unreadCount
      source {
        id
        displayName
      }
    }
  }
  sources(filter: { name: { includesInsensitive: $search } }, first: 20) {
    totalCount
    nodes {
      id
      name
      displayName
      lang
    }
  }
}
